<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- Missing viewport meta tag -->
    <title>This is a very long title that exceeds the recommended 60 character limit for optimal SEO performance in search results</title>
    <meta name="description" content="This meta description is way too long and exceeds the recommended 160 character limit for optimal display in search engine results pages which can cause truncation issues">
    <!-- Missing canonical link -->
    <!-- Missing Open Graph tags -->
</head>
<body>
    <!-- Multiple H1 tags (bad practice) -->
    <h1>First Main Heading</h1>
    <h1>Second Main Heading - This is problematic!</h1>
    
    <p>Some content here.</p>
    
    <!-- Images without alt attributes -->
    <img src="https://via.placeholder.com/400x300">
    <img src="https://via.placeholder.com/300x200" alt="">
    
    <h3>Skipped H2 - Bad heading hierarchy</h3>
    
    <div>
        <img src="https://via.placeholder.com/200x150">
        <p>Another paragraph with an image missing alt text above.</p>
    </div>
</body>
</html>
