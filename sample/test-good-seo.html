<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect SEO Example - Under 60 Characters</title>
    <meta name="description" content="This is a perfect meta description that is under 160 characters and provides valuable information about the page content.">
    <meta name="keywords" content="SEO, best practices, web development, optimization">
    <link rel="canonical" href="https://example.com/perfect-seo-page">
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Perfect SEO Example">
    <meta property="og:description" content="This page demonstrates perfect SEO implementation with all required meta tags.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://example.com/perfect-seo-page">
    <meta property="og:image" content="https://example.com/images/og-image.jpg">
    
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Perfect SEO Example">
    <meta name="twitter:description" content="This page demonstrates perfect SEO implementation.">
</head>
<body>
    <header>
        <h1>Main Heading - Only One H1 Per Page</h1>
        <nav>
            <ul>
                <li><a href="#section1">Section 1</a></li>
                <li><a href="#section2">Section 2</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section id="section1">
            <h2>Secondary Heading</h2>
            <p>This is content with proper semantic structure and good SEO practices.</p>
            <img src="https://via.placeholder.com/400x300" alt="Descriptive alt text for accessibility and SEO">
        </section>
        
        <section id="section2">
            <h2>Another Section</h2>
            <p>More quality content that adds value to users.</p>
            <img src="https://via.placeholder.com/300x200" alt="Another image with proper alt text describing the content">
        </section>
    </main>
    
    <footer>
        <p>&copy; 2024 Example Company. All rights reserved.</p>
    </footer>
</body>
</html>
